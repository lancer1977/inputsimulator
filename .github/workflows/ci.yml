name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: inputsimulator-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate
        run: bash scripts/validate.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: windowsinput-dotnet-nuget
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
